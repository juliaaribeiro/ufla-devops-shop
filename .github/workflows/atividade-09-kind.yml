name: Atividade 09 - evidências kind

on:
  push:
    branches: [atividade-09]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atividade-09-kind-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atividade:
    name: Executar atividade em runner Linux
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kind and kubectl
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSLo /tmp/kind \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kind" \
            | sha256sum --check
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind

          kubectl_version=v1.34.11
          curl -fsSLo /tmp/kubectl \
            "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
          curl -fsSLo /tmp/kubectl.sha256 \
            "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

          kind version
          kubectl version --client
          docker version

      - name: Run the activity and collect evidence
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/atividade-09-kind-ci.sh

      - name: Upload evidence and kind logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atividade-09-kind-evidencias-${{ github.run_id }}
          path: evidencia-atividade-09/
          if-no-files-found: warn
          retention-days: 30
