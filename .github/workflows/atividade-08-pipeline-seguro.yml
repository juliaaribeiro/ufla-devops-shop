name: Atividade 8 - Pipeline seguro

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  security-events: write
  packages: write

concurrency:
  group: atividade-8-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Testes e qualidade do código
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest coverage

      - name: Executar testes e cobertura
        run: |
          if [ -d tests ] || ls tests/*.py >/dev/null 2>&1 2>/dev/null; then
            pytest --maxfail=1 --disable-warnings --cov=. --cov-report=xml
          else
            TARGETS=""
            if [ -d app ]; then TARGETS="$TARGETS app"; fi
            if [ -d scripts ]; then TARGETS="$TARGETS scripts"; fi
            if [ -n "$TARGETS" ]; then
              python -m compileall $TARGETS
            else
              python -m compileall .
            fi
          fi

      - name: Gitleaks (histórico do Git)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          args: detect --source . --no-banner --redact --log-opts="--all --decorate=full"

  sonarcloud:
    name: SonarCloud - código novo
    runs-on: ubuntu-latest
    needs: qualidade
    if: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION || 'ufla' }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY || 'ufla-devops-shop' }}
            -Dsonar.sources=.
            -Dsonar.tests=tests
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=true
            -Dsonar.pullrequest.branch=${{ github.head_ref || github.ref_name }}
            -Dsonar.pullrequest.base=${{ github.base_ref || 'main' }}

  imagem:
    name: Build e scan da imagem Docker
    runs-on: ubuntu-latest
    needs: [qualidade, sonarcloud]
    if: ${{ always() && (needs.sonarcloud.result == 'success' || needs.sonarcloud.result == 'skipped') }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem local
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/ufla-devops-shop:${{ github.sha }}

      - name: Trivy filesystem (dependências)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Trivy image (gate de vulnerabilidade)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/ufla-devops-shop:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Gerar SBOM da imagem
        uses: anchore/sbom-action@v0
        with:
          image: local/ufla-devops-shop:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload do SBOM como artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-ufla-devops-shop
          path: sbom.spdx.json
          if-no-files-found: error

  entrega:
    name: Publicação final e deploy
    runs-on: ubuntu-latest
    needs: [imagem]
    if: ${{ success() }}
    steps:
      - name: Mensagem final de sucesso
        run: echo "Pipeline de segurança concluído com sucesso. A entrega só prossegue após todos os gates obrigatórios passarem."
