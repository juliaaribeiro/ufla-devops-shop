apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: checkpoint2-app-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "checkpoint2-app.labels" . | nindent 4 }}
spec:
  encryptedData:
    DATABASE_URL: {{ required "Preencha sealedSecret.encryptedDatabaseUrl com o ciphertext gerado por kubeseal para este ambiente" .Values.sealedSecret.encryptedDatabaseUrl | quote }}
  template:
    metadata:
      name: checkpoint2-app-secret
      namespace: {{ .Release.Namespace }}
    type: Opaque
