apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: checkpoint2-app-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "checkpoint2-app.labels" . | nindent 4 }}
spec:
  encryptedData:
    API_TOKEN: {{ required "Preencha sealedSecret.encryptedApiToken com o ciphertext gerado por kubeseal para este ambiente" .Values.sealedSecret.encryptedApiToken | quote }}
  template:
    metadata:
      name: checkpoint2-app-secret
      namespace: {{ .Release.Namespace }}
    type: Opaque
